<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Bookshelf</title><style>body{margin:0;background:#f8f4eb;color:#42382f;font-family:Georgia,serif}header,main{max-width:950px;margin:auto;padding:32px 20px}.feature{padding:32px;border-radius:20px;background:#e5eadd}.eyebrow{font:700 12px Arial;letter-spacing:3px;color:#65765f}.feature h2{font-size:clamp(40px,7vw,75px);margin:15px 0}button,input,select{padding:10px;border:1px solid #c8c6b8;border-radius:8px;font:inherit}button{background:#78866b;color:white;cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tools input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.book{padding:18px;border:1px solid #e2dbd0;background:white;border-radius:14px}.book h3{margin:0}.book p{color:#777}.book button{margin:5px 5px 0 0;font-size:13px}.categories{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0}.categories button{background:#e6e8dd;color:#465244;border:1px solid #ccd2c4}.categories button.active{background:#78866b;color:white}.book{min-height:160px;box-shadow:0 6px 18px #453b2b0a}.book h3{font-size:20px}.feature{background:linear-gradient(120deg,#e0e9dc,#f4e7d9);border:1px solid #d2d8ca}.tools{align-items:center}</style></head><body><header><h1>My Digital Bookshelf</h1><p>A personal reading journal</p></header><main><div class="feature"><div class="eyebrow">✦ CURRENTLY READING</div><h2>The Cactus</h2><p>A cozy corner for your current read</p></div><div class="categories"><button data-cat="all">All books</button><button data-cat="read">Already Read</button><button data-cat="want">Want to Read</button><button data-cat="notread">Not Read</button><button data-cat="started">Google Play Books</button></div><div class="tools"><input id="search" placeholder="Search books"><select id="filter"><option value="all">All</option><option value="want">Want to read</option><option value="started">Started</option><option value="notread">Not read</option><option value="read">Read</option></select><button id="add">+ Add book</button><button id="export">Export</button><label>Import <input type="file" id="import" accept=".json" style="max-width:180px"></label></div><div id="books" class="grid"></div></main><script>const original=[['Roald Dahl Collection','Roald Dahl','read','Childhood','Most books'],['Pride and Prejudice','Jane Austen','read','Classic'],['Wuthering Heights','Emily Brontë','read','Classic'],['Magic Tree House','Mary Pope Osborne','read','Childhood'],['The Hardy Boys','Franklin W. Dixon','read','Mystery'],['The Boxcar Children','Gertrude Chandler Warner','read','Mystery'],['Twilight','Stephenie Meyer','read','YA'],['Goosebumps','R. L. Stine','read','Horror','Some books'],['Junie B. Jones','Barbara Park','read','Childhood','Entire series'],['The Baby-Sitters Club','Ann M. Martin','read','Childhood'],['A Series of Unfortunate Events','Lemony Snicket','read','Fantasy'],['The Hunger Games','Suzanne Collins','read','YA'],['Holes','Louis Sachar','read','Classic'],['Island of the Blue Dolphins','Scott O’Dell','read','Classic'],['Amelia Bedelia','Peggy Parish','read','Childhood'],['Ramona Quimby','Beverly Cleary','read','Childhood'],['Judy Moody','Megan McDonald','read','Childhood'],['The Bailey School Kids','Debbie Dadey & Marcia Thornton Jones','read','Childhood'],['The Tale of Despereaux','Kate DiCamillo','read','Fantasy'],['The Sisterhood of the Traveling Pants','Ann Brashares','read','YA'],['Hatchet','Gary Paulsen','read','Classic'],['Harry Potter','J. K. Rowling','want','Fantasy'],['Percy Jackson','Rick Riordan','want','Fantasy'],['How to Be a Rich Old Lady','Author to confirm','want','Finance'],['The Princess Diaries','Meg Cabot','notread','YA'],['The Giver','Lois Lowry','notread','Classic'],['Tuck Everlasting','Natalie Babbitt','notread','Classic'],['Because of Winn-Dixie','Kate DiCamillo','notread','Classic'],['Wayside School','Louis Sachar','notread','Childhood'],['Captain Underpants','Dav Pilkey','notread','Childhood'],['To Kill a Mockingbird','Harper Lee','notread','Classic']];
const play=[['Frankenstein','Mary Shelley','Classics'],['The Selfish Gene','Richard Dawkins','Science'],['Stock Market Investing for Beginners','Giovanni Rigters','Finance'],['The Legend of Sleepy Hollow','Washington Irving','Classics'],['Siddhartha','Hermann Hesse','Classics'],['Twenty Thousand Leagues Under the Seas','Jules Verne','Classics'],['Robinson Crusoe','Daniel Defoe','Classics'],['The War of the Worlds','H. G. Wells','Classics'],['The Strange Case of Dr Jekyll and Mr Hyde','Robert Louis Stevenson','Classics'],['Lyrical Poems','Alfred Tennyson','Poetry'],['Lords of Creation','Ella Cheever Thayer','Literature'],['7 Habits of High Performance People','Charles Thomas','Self-development'],['God, Human, Animal, Machine','Meghan O’Gieblyn','Science'],['The Rational Optimist','Matt Ridley','Science'],['The Man Who Mistook His Wife for a Hat','Oliver Sacks','Science'],['The Biology Book','DK','Science'],['The Medicine Book','DK','Science'],['The Law Book','DK','Law'],['Genome','Matt Ridley','Science'],['The Gene: An Intimate History','Siddhartha Mukherjee','Science'],['The 7 Habits of Highly Effective People','Stephen R. Covey','Self-development'],['Introvert Doodles','Maureen Marzi Wilson','Self-development'],['What Should We Be Worried About?','John Brockman','Science'],['This Will Make You Smarter','John Brockman','Science'],['The Tell-Tale Brain','V. S. Ramachandran','Science'],['Genetics For Dummies','Tara Rodden Robinson','Science'],['The 4-Hour Workweek','Timothy Ferriss','Business'],['The $100 Startup','Chris Guillebeau','Business'],['How to Start a Conversation and Make Friends','Don Gabor','Self-development'],['Algorithms to Live By','Brian Christian & Tom Griffiths','Technology'],['Bioinformatics For Dummies','Jean-Michel Claverie & Cedric Notredame','Science'],['The Politics Book','DK','Law'],['Invested','Danielle Town & Phil Town','Finance'],['Human Body Anatomy','Knowledge Flow','Science'],['A System of Human Anatomy','Sir Erasmus Wilson','Science'],['Illustrated Manual of Pediatric Dermatology','Susan Bayliss Mallory et al.','Science'],['Morning Habits','Charles Thomas','Self-development'],['Systems Biology','Bernhard Ø. Palsson','Science'],['The Psychology of Relaxation','George Thomas White Patrick','Psychology'],['Nonlinear Dynamics and Chaos','Steven H. Strogatz','Science'],['How to Code in Python 3','Lisa Tagliaferri','Technology'],['Coding for Beginners','Author to confirm','Technology'],['Programming for Computations – Python','Svein Linge & Hans Petter Langtangen','Technology']];
const key="digital-bookshelf-books";let books=JSON.parse(localStorage.getItem(key)||"[]");if(!books.length){books=[...original.map((b,i)=>({id:i+1,title:b[0],author:b[1],status:b[2],genre:b[3],notes:b[4]||""})),...play.map((b,i)=>({id:1000+i,title:b[0],author:b[1],status:"started",genre:b[2],notes:"Google Play Books"}))];localStorage.setItem(key,JSON.stringify(books))}let activeCategory="all";const save=()=>{localStorage.setItem(key,JSON.stringify(books));render()};const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function render(){const q=document.getElementById("search").value.toLowerCase(),f=activeCategory==="all"?document.getElementById("filter").value:activeCategory;document.getElementById("books").innerHTML=books.filter(b=>(f==="all"||b.status===f)&&(b.title+" "+(b.author||"")).toLowerCase().includes(q)).map((b,i)=>"<div class=book><h3>"+esc(b.title)+"</h3><p>"+esc(b.author)+"</p><p>"+esc(b.status)+"</p><button data-id="+b.id+" data-act=status>Change status</button><button data-id="+b.id+" data-act=remove>Remove</button></div>").join("")||"<p>Your bookshelf is ready for books.</p>"}document.getElementById("add").onclick=()=>{const title=prompt("Book title");if(!title)return;const author=prompt("Author")||"";books.push({id:Date.now(),title,author,status:"want"});save()};document.getElementById("books").onclick=e=>{const b=e.target.closest("button");if(!b)return;const book=books.find(x=>String(x.id)===b.dataset.id);if(!book)return;if(b.dataset.act==="remove"){books=books.filter(x=>x!==book)}else book.status=({want:"started",started:"read",read:"want"})[book.status]||"want";save()};document.querySelectorAll(".categories button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;document.querySelectorAll(".categories button").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelector(".categories button").classList.add("active");document.getElementById("search").oninput=render;document.getElementById("filter").onchange=render;document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:"application/json"}));a.href=u;a.download="bookshelf-backup.json";a.click();URL.revokeObjectURL(u)};document.getElementById("import").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error("Invalid backup");books=data.filter(x=>x&&x.title).map((x,i)=>({...x,id:x.id||Date.now()+i}));save()}catch(err){alert(err.message)}};render();</script></body></html>
