<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Bookshelf</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap');
:root{--ink:#3e3b33;--olive:#697762;--muted:#827f73;--paper:#f8f5ed;--line:#e7e0d2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:14px}header,main{max-width:1190px;margin:auto;padding:0 34px}header{padding-top:42px;padding-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #ddd8cb}header h1{font:600 clamp(30px,4vw,47px)/1.1 'Playfair Display',Georgia,serif;letter-spacing:-.025em;margin:0 0 9px}header p{color:#817e73;letter-spacing:.03em;margin:0;font-size:13px}main{padding-top:32px;padding-bottom:80px}.feature{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;min-height:265px;border-radius:8px;background:#e8ebe2;border:1px solid #dce0d5;padding:38px 52px;margin-bottom:36px}.feature:before{content:'';position:absolute;right:-45px;top:-100px;width:390px;height:390px;border:1px solid #bec7b9;border-radius:50%;box-shadow:0 0 0 32px #e8ebe2,0 0 0 33px #cdd6c8,0 0 0 70px #e8ebe2,0 0 0 71px #d5ddd0;opacity:.7}.feature:after{content:'THE CACTUS';position:absolute;right:92px;top:33px;width:150px;height:195px;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(145deg,#c5a78a,#a77962);box-shadow:11px 14px 0 #7f6254,18px 21px 28px #61584a38;border:5px solid #e7d5bf;outline:1px solid #987763;outline-offset:-12px;color:#fff4dc;text-align:center;font:600 26px/1.3 'Playfair Display',serif;letter-spacing:.08em;transform:rotate(-9deg)}.feature .eyebrow{font:700 10px 'DM Sans',sans-serif;letter-spacing:.26em;color:#61735d}.feature h2{position:relative;z-index:1;font:500 clamp(44px,6vw,78px)/1.08 'Playfair Display',Georgia,serif;letter-spacing:-.04em;margin:20px 0 13px}.feature p{font-size:14px;color:#72776c;margin:0}.categories{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 24px;padding-bottom:17px;border-bottom:1px solid #e2ddcf}.categories button{background:transparent;border:0;border-radius:0;padding:12px 18px;color:#77796d;font:600 12px 'DM Sans',sans-serif;cursor:pointer}.categories button.active{background:#e2e7db;color:#485a47;border-radius:6px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:25px}button,input,select{font-family:'DM Sans',sans-serif;font-size:12px;border:1px solid #ddd8ca;border-radius:6px;padding:11px 13px;background:#fffdf8;color:#4a483e}button{cursor:pointer;transition:background .2s,transform .2s}button:hover{transform:translateY(-1px)}.tools input#search{flex:1;min-width:200px;padding:13px 16px}.tools select{min-width:135px}.tools button{background:#6c7b66;color:white;border-color:#6c7b66;font-weight:600}.tools label{display:flex;align-items:center;gap:6px;color:#767368;font-size:12px}.tools label input{max-width:140px;background:transparent;padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px}.book{position:relative;display:flex;flex-direction:column;min-height:318px;border:1px solid #e8e0d3;background:#fffdf9;border-radius:7px;padding:15px 15px 14px;box-shadow:0 5px 16px #5a48300a;overflow:hidden}.book:before{content:'';display:block;height:170px;margin-bottom:16px;border-radius:3px;background:linear-gradient(130deg,#b6c1b0,#788d83);box-shadow:inset 7px 0 0 #00000012,inset 0 0 0 1px #ffffff40}.book:nth-child(6n+2):before{background:linear-gradient(130deg,#c7a991,#9d7866)}.book:nth-child(6n+3):before{background:linear-gradient(130deg,#a9b6c2,#6c8297)}.book:nth-child(6n+4):before{background:linear-gradient(130deg,#d3bc8f,#a99266)}.book:nth-child(6n+5):before{background:linear-gradient(130deg,#bcb2c2,#8f8099)}.book:nth-child(6n+6):before{background:linear-gradient(130deg,#b8c0a4,#818d6a)}.book h3{position:absolute;top:42px;left:30px;right:30px;color:#fff9ed;font:600 20px/1.28 'Playfair Display',Georgia,serif;text-shadow:0 1px 2px #0004;min-height:75px;margin:0;overflow-wrap:anywhere}.book p{font-size:12px;color:#888174;margin:0 0 8px;line-height:1.5}.book p:nth-of-type(1){font-weight:600;color:#504e44;font-size:13px}.book button{margin:8px 5px 0 0;padding:7px 9px;border:1px solid #d9ddd4;background:#f1f4ee;color:#62715c;font-size:10px;font-weight:600}.book button[data-act=remove]{background:transparent;color:#9b8e83;border-color:transparent}.book p:last-of-type{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#83917c}.book button:first-of-type{margin-top:auto}.grid>p{grid-column:1/-1;color:#8a8476;padding:20px 0}@media(max-width:650px){header,main{padding-left:18px;padding-right:18px}.feature{padding:28px;min-height:230px}.feature:after{right:20px;top:65px;width:85px;height:110px;font-size:13px;opacity:.6}.feature h2{font-size:48px;max-width:220px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.book{padding:10px;min-height:295px}.book:before{height:155px}.book h3{left:21px;right:18px;font-size:17px}.tools label{width:100%}}
</style></head><body><header><h1>My Digital Bookshelf</h1><p>A personal reading journal</p></header><main><div class="feature"><div class="eyebrow">✦ CURRENTLY READING</div><h2>The Cactus</h2><p>A cozy corner for your current read</p></div><div class="categories"><button data-cat="all">All books</button><button data-cat="read">Already Read</button><button data-cat="want">Want to Read</button><button data-cat="notread">Not Read</button><button data-cat="started">Google Play Books</button></div><div class="tools"><input id="search" placeholder="Search books"><select id="filter"><option value="all">All</option><option value="want">Want to read</option><option value="started">Started</option><option value="notread">Not read</option><option value="read">Read</option></select><button id="add">+ Add book</button><button id="export">Export</button><label>Import <input type="file" id="import" accept=".json" style="max-width:180px"></label></div><div id="books" class="grid"></div></main><script>const original=[['Roald Dahl Collection','Roald Dahl','read','Childhood','Most books'],['Pride and Prejudice','Jane Austen','read','Classic'],['Wuthering Heights','Emily Brontë','read','Classic'],['Magic Tree House','Mary Pope Osborne','read','Childhood'],['The Hardy Boys','Franklin W. Dixon','read','Mystery'],['The Boxcar Children','Gertrude Chandler Warner','read','Mystery'],['Twilight','Stephenie Meyer','read','YA'],['Goosebumps','R. L. Stine','read','Horror','Some books'],['Junie B. Jones','Barbara Park','read','Childhood','Entire series'],['The Baby-Sitters Club','Ann M. Martin','read','Childhood'],['A Series of Unfortunate Events','Lemony Snicket','read','Fantasy'],['The Hunger Games','Suzanne Collins','read','YA'],['Holes','Louis Sachar','read','Classic'],['Island of the Blue Dolphins','Scott O’Dell','read','Classic'],['Amelia Bedelia','Peggy Parish','read','Childhood'],['Ramona Quimby','Beverly Cleary','read','Childhood'],['Judy Moody','Megan McDonald','read','Childhood'],['The Bailey School Kids','Debbie Dadey & Marcia Thornton Jones','read','Childhood'],['The Tale of Despereaux','Kate DiCamillo','read','Fantasy'],['The Sisterhood of the Traveling Pants','Ann Brashares','read','YA'],['Hatchet','Gary Paulsen','read','Classic'],['Harry Potter','J. K. Rowling','want','Fantasy'],['Percy Jackson','Rick Riordan','want','Fantasy'],['How to Be a Rich Old Lady','Author to confirm','want','Finance'],['The Princess Diaries','Meg Cabot','notread','YA'],['The Giver','Lois Lowry','notread','Classic'],['Tuck Everlasting','Natalie Babbitt','notread','Classic'],['Because of Winn-Dixie','Kate DiCamillo','notread','Classic'],['Wayside School','Louis Sachar','notread','Childhood'],['Captain Underpants','Dav Pilkey','notread','Childhood'],['To Kill a Mockingbird','Harper Lee','notread','Classic']];
const play=[['Frankenstein','Mary Shelley','Classics'],['The Selfish Gene','Richard Dawkins','Science'],['Stock Market Investing for Beginners','Giovanni Rigters','Finance'],['The Legend of Sleepy Hollow','Washington Irving','Classics'],['Siddhartha','Hermann Hesse','Classics'],['Twenty Thousand Leagues Under the Seas','Jules Verne','Classics'],['Robinson Crusoe','Daniel Defoe','Classics'],['The War of the Worlds','H. G. Wells','Classics'],['The Strange Case of Dr Jekyll and Mr Hyde','Robert Louis Stevenson','Classics'],['Lyrical Poems','Alfred Tennyson','Poetry'],['Lords of Creation','Ella Cheever Thayer','Literature'],['7 Habits of High Performance People','Charles Thomas','Self-development'],['God, Human, Animal, Machine','Meghan O’Gieblyn','Science'],['The Rational Optimist','Matt Ridley','Science'],['The Man Who Mistook His Wife for a Hat','Oliver Sacks','Science'],['The Biology Book','DK','Science'],['The Medicine Book','DK','Science'],['The Law Book','DK','Law'],['Genome','Matt Ridley','Science'],['The Gene: An Intimate History','Siddhartha Mukherjee','Science'],['The 7 Habits of Highly Effective People','Stephen R. Covey','Self-development'],['Introvert Doodles','Maureen Marzi Wilson','Self-development'],['What Should We Be Worried About?','John Brockman','Science'],['This Will Make You Smarter','John Brockman','Science'],['The Tell-Tale Brain','V. S. Ramachandran','Science'],['Genetics For Dummies','Tara Rodden Robinson','Science'],['The 4-Hour Workweek','Timothy Ferriss','Business'],['The $100 Startup','Chris Guillebeau','Business'],['How to Start a Conversation and Make Friends','Don Gabor','Self-development'],['Algorithms to Live By','Brian Christian & Tom Griffiths','Technology'],['Bioinformatics For Dummies','Jean-Michel Claverie & Cedric Notredame','Science'],['The Politics Book','DK','Law'],['Invested','Danielle Town & Phil Town','Finance'],['Human Body Anatomy','Knowledge Flow','Science'],['A System of Human Anatomy','Sir Erasmus Wilson','Science'],['Illustrated Manual of Pediatric Dermatology','Susan Bayliss Mallory et al.','Science'],['Morning Habits','Charles Thomas','Self-development'],['Systems Biology','Bernhard Ø. Palsson','Science'],['The Psychology of Relaxation','George Thomas White Patrick','Psychology'],['Nonlinear Dynamics and Chaos','Steven H. Strogatz','Science'],['How to Code in Python 3','Lisa Tagliaferri','Technology'],['Coding for Beginners','Author to confirm','Technology'],['Programming for Computations – Python','Svein Linge & Hans Petter Langtangen','Technology']];
const key="digital-bookshelf-books";let books=JSON.parse(localStorage.getItem(key)||"[]");if(!books.length){books=[...original.map((b,i)=>({id:i+1,title:b[0],author:b[1],status:b[2],genre:b[3],notes:b[4]||""})),...play.map((b,i)=>({id:1000+i,title:b[0],author:b[1],status:"started",genre:b[2],notes:"Google Play Books"}))];localStorage.setItem(key,JSON.stringify(books))}let activeCategory="all";const save=()=>{localStorage.setItem(key,JSON.stringify(books));render()};const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function render(){const q=document.getElementById("search").value.toLowerCase(),f=activeCategory==="all"?document.getElementById("filter").value:activeCategory;document.getElementById("books").innerHTML=books.filter(b=>(f==="all"||b.status===f)&&(b.title+" "+(b.author||"")).toLowerCase().includes(q)).map((b,i)=>"<div class=book><h3>"+esc(b.title)+"</h3><p>"+esc(b.author)+"</p><p>"+esc(b.status)+"</p><button data-id="+b.id+" data-act=status>Change status</button><button data-id="+b.id+" data-act=remove>Remove</button></div>").join("")||"<p>Your bookshelf is ready for books.</p>"}document.getElementById("add").onclick=()=>{const title=prompt("Book title");if(!title)return;const author=prompt("Author")||"";books.push({id:Date.now(),title,author,status:"want"});save()};document.getElementById("books").onclick=e=>{const b=e.target.closest("button");if(!b)return;const book=books.find(x=>String(x.id)===b.dataset.id);if(!book)return;if(b.dataset.act==="remove"){books=books.filter(x=>x!==book)}else book.status=({want:"started",started:"read",read:"want"})[book.status]||"want";save()};document.querySelectorAll(".categories button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;document.querySelectorAll(".categories button").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelector(".categories button").classList.add("active");document.getElementById("search").oninput=render;document.getElementById("filter").onchange=render;document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:"application/json"}));a.href=u;a.download="bookshelf-backup.json";a.click();URL.revokeObjectURL(u)};document.getElementById("import").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error("Invalid backup");books=data.filter(x=>x&&x.title).map((x,i)=>({...x,id:x.id||Date.now()+i}));save()}catch(err){alert(err.message)}};render();</script></body></html>
