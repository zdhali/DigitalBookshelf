<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Bookshelf</title><style>body{margin:0;background:#f8f4eb;color:#42382f;font-family:Georgia,serif}header,main{max-width:950px;margin:auto;padding:32px 20px}.feature{padding:32px;border-radius:20px;background:#e5eadd}.eyebrow{font:700 12px Arial;letter-spacing:3px;color:#65765f}.feature h2{font-size:clamp(40px,7vw,75px);margin:15px 0}button,input,select{padding:10px;border:1px solid #c8c6b8;border-radius:8px;font:inherit}button{background:#78866b;color:white;cursor:pointer}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tools input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.book{padding:18px;border:1px solid #e2dbd0;background:white;border-radius:14px}.book h3{margin:0}.book p{color:#777}.book button{margin:5px 5px 0 0;font-size:13px}</style></head><body><header><h1>My Digital Bookshelf</h1><p>A personal reading journal</p></header><main><div class="feature"><div class="eyebrow">CURRENTLY READING</div><h2>The Cactus</h2></div><div class="tools"><input id="search" placeholder="Search books"><select id="filter"><option value="all">All</option><option value="want">Want to read</option><option value="started">Started</option><option value="read">Read</option></select><button id="add">+ Add book</button><button id="export">Export</button><label>Import <input type="file" id="import" accept=".json" style="max-width:180px"></label></div><div id="books" class="grid"></div></main><script>const key="digital-bookshelf-books";let books=JSON.parse(localStorage.getItem(key)||"[]");const save=()=>{localStorage.setItem(key,JSON.stringify(books));render()};const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function render(){const q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;document.getElementById("books").innerHTML=books.filter(b=>(f==="all"||b.status===f)&&(b.title+" "+(b.author||"")).toLowerCase().includes(q)).map((b,i)=>"<div class=book><h3>"+esc(b.title)+"</h3><p>"+esc(b.author)+"</p><p>"+esc(b.status)+"</p><button data-id="+b.id+" data-act=status>Change status</button><button data-id="+b.id+" data-act=remove>Remove</button></div>").join("")||"<p>Your bookshelf is ready for books.</p>"}document.getElementById("add").onclick=()=>{const title=prompt("Book title");if(!title)return;const author=prompt("Author")||"";books.push({id:Date.now(),title,author,status:"want"});save()};document.getElementById("books").onclick=e=>{const b=e.target.closest("button");if(!b)return;const book=books.find(x=>String(x.id)===b.dataset.id);if(!book)return;if(b.dataset.act==="remove"){books=books.filter(x=>x!==book)}else book.status=({want:"started",started:"read",read:"want"})[book.status]||"want";save()};document.getElementById("search").oninput=render;document.getElementById("filter").onchange=render;document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:"application/json"}));a.href=u;a.download="bookshelf-backup.json";a.click();URL.revokeObjectURL(u)};document.getElementById("import").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error("Invalid backup");books=data.filter(x=>x&&x.title).map((x,i)=>({...x,id:x.id||Date.now()+i}));save()}catch(err){alert(err.message)}};render();</script></body></html>
