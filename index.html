</style></head><body><header><h1>My Digital Bookshelf</h1><p>A personal reading journal</p></header><main><div class="feature"><div class="eyebrow">✦ CURRENTLY READING</div><h2>The Cactus</h2><p>A cozy corner for your current read</p></div><div class="library-intro"><span>Browse the Collection</span></div><div class="categories"><button data-cat="all">All books</button><button data-cat="read">Already Read</button><button data-cat="want">Want to Read</button><button data-cat="notread">Not Read</button><button data-cat="started">Google Play Books</button></div><div class="genre-bar"><span>Browse by genre</span><select id="genreFilter"><option value="all">All genres</option></select><label class="childhood-toggle"><input type="checkbox" id="childhoodOnly"> Childhood favorites</label></div><div class="tools"><input id="search" placeholder="Search books"><select id="filter"><option value="all">All</option><option value="want">Want to read</option><option value="started">Started</option><option value="notread">Not read</option><option value="read">Read</option></select><button id="add">+ Add book</button><button id="export">Export</button><label>Import <input type="file" id="import" accept=".json" style="max-width:180px"></label></div><div id="books" class="grid"></div><p class="library-note">A home for stories read, loved, and waiting to be discovered. ✦</p></main><script>const original=[['Roald Dahl Collection','Roald Dahl','read','Childhood','Most books'],['Pride and Prejudice','Jane Austen','read','Classic'],['Wuthering Heights','Emily Brontë','read','Classic'],['Magic Tree House','Mary Pope Osborne','read','Childhood'],['The Hardy Boys','Franklin W. Dixon','read','Mystery'],['The Boxcar Children','Gertrude Chandler Warner','read','Mystery'],['Twilight','Stephenie Meyer','read','YA'],['Goosebumps','R. L. Stine','read','Horror','Some books'],['Junie B. Jones','Barbara Park','read','Childhood','Entire series'],['The Baby-Sitters Club','Ann M. Martin','read','Childhood'],['A Series of Unfortunate Events','Lemony Snicket','read','Fantasy'],['The Hunger Games','Suzanne Collins','read','YA'],['Holes','Louis Sachar','read','Classic'],['Island of the Blue Dolphins','Scott O’Dell','read','Classic'],['Amelia Bedelia','Peggy Parish','read','Childhood'],['Flat Stanley','Jeff Brown','read','Childhood','Childhood favorite'],['Ramona Quimby','Beverly Cleary','read','Childhood'],['Judy Moody','Megan McDonald','read','Childhood'],['The Bailey School Kids','Debbie Dadey & Marcia Thornton Jones','read','Childhood'],['The Tale of Despereaux','Kate DiCamillo','read','Fantasy'],['The Sisterhood of the Traveling Pants','Ann Brashares','read','YA'],['Hatchet','Gary Paulsen','read','Classic'],['Harry Potter','J. K. Rowling','want','Fantasy'],['Percy Jackson','Rick Riordan','want','Fantasy'],['How to Be a Rich Old Lady','Author to confirm','want','Finance'],['The Princess Diaries','Meg Cabot','notread','YA'],['The Giver','Lois Lowry','notread','Classic'],['Tuck Everlasting','Natalie Babbitt','notread','Classic'],['Because of Winn-Dixie','Kate DiCamillo','notread','Classic'],['Wayside School','Louis Sachar','notread','Childhood'],['Captain Underpants','Dav Pilkey','notread','Childhood'],['To Kill a Mockingbird','Harper Lee','notread','Classic']];
const play=[['Frankenstein','Mary Shelley','Classics'],['The Selfish Gene','Richard Dawkins','Science'],['Stock Market Investing for Beginners','Giovanni Rigters','Finance'],['The Legend of Sleepy Hollow','Washington Irving','Classics'],['Siddhartha','Hermann Hesse','Classics'],['Twenty Thousand Leagues Under the Seas','Jules Verne','Classics'],['Robinson Crusoe','Daniel Defoe','Classics'],['The War of the Worlds','H. G. Wells','Classics'],['The Strange Case of Dr Jekyll and Mr Hyde','Robert Louis Stevenson','Classics'],['Lyrical Poems','Alfred Tennyson','Poetry'],['Lords of Creation','Ella Cheever Thayer','Literature'],['7 Habits of High Performance People','Charles Thomas','Self-development'],['God, Human, Animal, Machine','Meghan O’Gieblyn','Science'],['The Rational Optimist','Matt Ridley','Science'],['The Man Who Mistook His Wife for a Hat','Oliver Sacks','Science'],['The Biology Book','DK','Science'],['The Medicine Book','DK','Science'],['The Law Book','DK','Law'],['Genome','Matt Ridley','Science'],['The Gene: An Intimate History','Siddhartha Mukherjee','Science'],['The 7 Habits of Highly Effective People','Stephen R. Covey','Self-development'],['Introvert Doodles','Maureen Marzi Wilson','Self-development'],['What Should We Be Worried About?','John Brockman','Science'],['This Will Make You Smarter','John Brockman','Science'],['The Tell-Tale Brain','V. S. Ramachandran','Science'],['Genetics For Dummies','Tara Rodden Robinson','Science'],['The 4-Hour Workweek','Timothy Ferriss','Business'],['The $100 Startup','Chris Guillebeau','Business'],['How to Start a Conversation and Make Friends','Don Gabor','Self-development'],['Algorithms to Live By','Brian Christian & Tom Griffiths','Technology'],['Bioinformatics For Dummies','Jean-Michel Claverie & Cedric Notredame','Science'],['The Politics Book','DK','Law'],['Invested','Danielle Town & Phil Town','Finance'],['Human Body Anatomy','Knowledge Flow','Science'],['A System of Human Anatomy','Sir Erasmus Wilson','Science'],['Illustrated Manual of Pediatric Dermatology','Susan Bayliss Mallory et al.','Science'],['Morning Habits','Charles Thomas','Self-development'],['Systems Biology','Bernhard Ø. Palsson','Science'],['The Psychology of Relaxation','George Thomas White Patrick','Psychology'],['Nonlinear Dynamics and Chaos','Steven H. Strogatz','Science'],['How to Code in Python 3','Lisa Tagliaferri','Technology'],['Coding for Beginners','Author to confirm','Technology'],['Programming for Computations – Python','Svein Linge & Hans Petter Langtangen','Technology']];
const key="digital-bookshelf-books";let books=JSON.parse(localStorage.getItem(key)||"[]");if(!books.length){books=[...original.map((b,i)=>({id:i+1,title:b[0],author:b[1],status:b[2],genre:b[3],notes:b[4]||""})),...play.map((b,i)=>({id:1000+i,title:b[0],author:b[1],status:"started",genre:b[2],notes:"Google Play Books"}))];localStorage.setItem(key,JSON.stringify(books))}if(!books.some(b=>b.title?.trim().toLowerCase()==="flat stanley")){books.push({id:Date.now()+17,title:"Flat Stanley",author:"Jeff Brown",status:"read",genre:"Childhood",notes:"Childhood favorite"});localStorage.setItem(key,JSON.stringify(books))}let activeCategory="all";const childhoodTitles=new Set(['Roald Dahl Collection','Magic Tree House','The Hardy Boys','The Boxcar Children','Goosebumps','Junie B. Jones','The Baby-Sitters Club','A Series of Unfortunate Events','Holes','Island of the Blue Dolphins','Amelia Bedelia','Ramona Quimby','Beverly Cleary','Judy Moody','The Bailey School Kids','The Tale of Despereaux','Hatchet','The Princess Diaries','The Giver','Tuck Everlasting','Because of Winn-Dixie','Wayside School','Captain Underpants','Percy Jackson','Harry Potter']);
const childhoodGenres=new Set(['Childhood']);
const isChildhood=b=>childhoodGenres.has(b.genre)||childhoodTitles.has(b.title);
const normalizedGenre=b=>b.genre||'Uncategorized';
function updateGenreOptions(){const select=document.getElementById('genreFilter');const selected=select.value;const genres=[...new Set(books.map(normalizedGenre))].sort((a,b)=>a.localeCompare(b));select.innerHTML='<option value="all">All genres</option>'+genres.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');select.value=genres.includes(selected)?selected:'all'}
updateGenreOptions();document.getElementById('genreFilter').onchange=render;document.getElementById('childhoodOnly').onchange=render;
const save=()=>{localStorage.setItem(key,JSON.stringify(books));render()};const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));function render(){const q=document.getElementById("search").value.toLowerCase(),f=activeCategory==="all"?document.getElementById("filter").value:activeCategory;document.getElementById("books").innerHTML=books.filter(b=>(f==="all"||b.status===f)&&(document.getElementById("genreFilter").value==="all"||normalizedGenre(b)===document.getElementById("genreFilter").value)&&(!document.getElementById("childhoodOnly").checked||isChildhood(b))&&(b.title+" "+(b.author||"")+" "+normalizedGenre(b)).toLowerCase().includes(q)).map((b,i)=>"<div class=book><h3>"+esc(b.title)+"</h3>"+(isChildhood(b)?"<span class=book-tag>Childhood</span>":"")+"<p>"+esc(b.author)+"</p><p class=book-genre>"+esc(normalizedGenre(b))+"</p><div class=book-actions><button data-id="+b.id+" data-act=status>Change status</button><button data-id="+b.id+" data-act=remove>Remove</button></div></div>").join("")||"<p>Your bookshelf is ready for books.</p>"}document.getElementById("add").onclick=()=>{const title=prompt("Book title");if(!title)return;const author=prompt("Author")||"";const genre=prompt("Genre (e.g. Fantasy, Classics, Science, Childhood)")||"Uncategorized";books.push({id:Date.now(),title,author,genre,status:"want"});updateGenreOptions();save()};document.getElementById("books").onclick=e=>{const b=e.target.closest("button");if(!b)return;const book=books.find(x=>String(x.id)===b.dataset.id);if(!book)return;if(b.dataset.act==="remove"){books=books.filter(x=>x!==book)}else book.status=({want:"started",started:"read",read:"want"})[book.status]||"want";save()};document.querySelectorAll(".categories button").forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;document.querySelectorAll(".categories button").forEach(x=>x.classList.toggle("active",x===b));render()});document.querySelector(".categories button").classList.add("active");document.getElementById("search").oninput=render;document.getElementById("filter").onchange=render;document.getElementById("export").onclick=()=>{const a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(books,null,2)],{type:"application/json"}));a.href=u;a.download="bookshelf-backup.json";a.click();URL.revokeObjectURL(u)};document.getElementById("import").onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw Error("Invalid backup");books=data.filter(x=>x&&x.title).map((x,i)=>({...x,id:x.id||Date.now()+i}));updateGenreOptions();save()}catch(err){alert(err.message)}};render();</script></body></html>
